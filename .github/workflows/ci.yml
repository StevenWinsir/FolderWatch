name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: ['1.23.x', '1.26.x']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - run: go mod download
      - run: make lint
      - run: go build ./...
      - run: go test -count=1 ./...
      - run: go test -race -count=1 ./...
      - run: go test -count=3 ./internal/watcher ./internal/debounce ./internal/snapshot ./internal/filetype ./internal/diff ./internal/changes ./internal/app
      - run: make smoke
  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: GOOS=darwin GOARCH=arm64 go build ./...
      - run: GOOS=darwin GOARCH=amd64 go build ./...
      - run: GOOS=windows GOARCH=amd64 go build ./...
