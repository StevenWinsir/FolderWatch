# Copy to <root>/.folderwatch.toml or the OS user config directory.
# FolderWatch does not create this file automatically.
debounce = "150ms"           # R2 settling window; max wait is 4x
max_diff_bytes = "5MiB"     # R3 diff cap per side, maximum 64MiB
max_snapshot_bytes = "8MiB" # R3 independent classification/retention cap
max_diff_lines = 20000      # R3 diff lines per side, maximum 200000
max_pending_events = 4096
max_watch_dirs = 8192       # Native registration budget; resource exhaustion falls back to polling.
max_snapshot_files = 0     # No default inventory-count cap; positive values are opt-in limits.
snapshot_memory_bytes = "32MiB"
snapshot_cache_bytes = "256MiB"
ignore = ["node_modules/", "*.tmp"]
respect_gitignore = false
include_git = false
no_mouse = false            # R4: disable mouse; keyboard actions stay available
editor = ""                 # Stored only, not executed
log_file = ""               # Live modes only: NEW private file outside root, max 4MiB
debug = false               # R4: metadata diagnostics in bounded ring (e in TUI)
# ignore_file = "rules.ignore"  # Relative to this TOML file; must exist if set
